type Mutation {
  approveStep(
    step_run_id: uuid!
  ): ApproveStepOutput
}

type Mutation {
  triggerWorkflowRun(
    workflow_id: uuid!
  ): TriggerWorkflowRunOutput
}

type TriggerWorkflowRunOutput {
  run_id: uuid!
  status: String!
}

type ApproveStepOutput {
  success: Boolean!
  message: String!
}

