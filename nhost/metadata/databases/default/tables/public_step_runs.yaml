table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: step_id
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        workflow_run:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
event_triggers:
  - name: notify_step_completed
    definition:
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns:
          - status
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 30
    webhook: 'https://ibihgkettpjhsjxndalv.functions.ap-south-1.nhost.run/v1/notify-handler'
    headers:
      - name: x-nhost-webhook-secret
        value_from_env: NHOST_WEBHOOK_SECRET
