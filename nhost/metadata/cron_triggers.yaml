- name: scheduled_workflow_runner
  webhook: '{{NHOST_FUNCTIONS_URL}}/scheduled-runner'
  schedule: '* * * * *'
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 2
    retry_interval_seconds: 15
    timeout_seconds: 30
  headers:
    - name: x-nhost-webhook-secret
      value_from_env: NHOST_WEBHOOK_SECRET
